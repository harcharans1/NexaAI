
<aside class="sidebar">
  <a class="brand" routerLink="/dashboard">
    <span class="brand-icon">N</span>
    <span>Nexa<span class="brand-ai">AI</span></span>
  </a>

  <p class="section-label">WORKSPACE</p>

  <nav class="nav-list">
    <a routerLink="/dashboard" routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
      <span class="nav-icon">◫</span>
      <span>Dashboard</span>
    </a>

    <a routerLink="/ai-tools" routerLinkActive="active" class="nav-link">
      <span class="nav-icon">✧</span>
      <span>AI Tools</span>
    </a>

    <a routerLink="/history" routerLinkActive="active" class="nav-link">
      <span class="nav-icon">◷</span>
      <span>History</span>
    </a>

    <a routerLink="/settings" routerLinkActive="active" class="nav-link">
      <span class="nav-icon">⚙</span>
      <span>Settings</span>
    </a>
  </nav>

  <div class="sidebar-bottom">
    <div class="upgrade-card">
      <span class="upgrade-icon">✦</span>
      <h3>Unlock your potential</h3>
      <p>Make more of your ideas with AI.</p>
      <a routerLink="/ai-tools">Explore AI tools <span>→</span></a>
    </div>

    <div class="user-row">
      <div class="avatar">N</div>
      <div class="user-details">
        <strong>NexaAI User</strong>
        <span>Free workspace</span>
      </div>
    </div>
  </div>
</aside>
